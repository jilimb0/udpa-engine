name: 'UDPA Engine — Sovereign Software Assay & Capital Underwriting Covenant'
description: 'Runs bundled Gavel v1.0.0 assay engine (no build step): deterministic AST/Taint/FinOps assay, Ed25519 Zero-Knowledge Passport & OASIS SARIF 2.1.0 export.'
author: 'UDPA / Gavel Protocol'
branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  target-path:
    description: 'Relative path to the repository or subdirectory to assay'
    required: false
    default: '.'
  min-purity:
    description: 'Minimum required Assay Purity Score (0-100) to pass the covenant gate'
    required: false
    default: '80'
  min-score:
    description: 'Legacy alias for min-purity'
    required: false
    default: '80'
  stage:
    description: 'Project lifecycle stage (Idea | MVP | Scale)'
    required: false
    default: 'Scale'
  sarif-output:
    description: 'Output file path for OASIS SARIF 2.1.0 report'
    required: false
    default: 'udpa-audit.sarif'
  passport-output:
    description: 'Output file path for Ed25519 + SHA-256 Merkle Zero-Knowledge Passport'
    required: false
    default: 'udpa-zk-passport.json'
  fail-on-breach:
    description: 'Fail the step when the assay verdict is below min-purity. Set to false for advisory (warning-only) runs.'
    required: false
    default: 'true'

outputs:
  sarif-file:
    description: 'Path to generated OASIS SARIF 2.1.0 file'
    value: ${{ steps.udpa-gate.outputs.sarif-file }}
  passport-file:
    description: 'Path to generated Ed25519 Zero-Knowledge Passport'
    value: ${{ steps.udpa-gate.outputs.passport-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Execute UDPA Covenant Gate, SARIF 2.1.0 & Ed25519 ZK Seal
      id: udpa-gate
      shell: bash
      run: |
        set +e

        MIN_PURITY="${{ inputs.min-purity }}"
        if [ -z "${MIN_PURITY// /}" ] || [ "$MIN_PURITY" = "80" ]; then
          ALIAS="${{ inputs.min-score }}"
          if [ -n "${ALIAS// /}" ] && [ "$ALIAS" != "80" ]; then
            MIN_PURITY="$ALIAS"
          fi
        fi

        ENGINE="${{ github.action_path }}/engine/gavel-engine.cjs"
        chmod +x "$ENGINE"

        node "$ENGINE" seal "${{ inputs.target-path }}" --stage "${{ inputs.stage }}" --out "${{ inputs.passport-output }}"
        SEAL_STATUS=$?
        if [ "$SEAL_STATUS" -ne 0 ]; then
          exit "$SEAL_STATUS"
        fi

        GATE_LOG="$(mktemp)"
        node "$ENGINE" underwrite "${{ inputs.target-path }}" --stage "${{ inputs.stage }}" --min-purity "$MIN_PURITY" --sarif-out "${{ inputs.sarif-output }}" | tee "$GATE_LOG"
        GATE_STATUS=${PIPESTATUS[0]}

        SCORE="$(grep -oE 'Assay Purity Score: [0-9]+' "$GATE_LOG" | head -n1 | grep -oE '[0-9]+')"
        if [ -n "$SCORE" ]; then
          echo "UDPA purity score: **$SCORE/100** (required: $MIN_PURITY)" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$GATE_STATUS" -ne 0 ]; then
          if [ "${{ inputs.fail-on-breach }}" != "true" ] && [ -s "${{ inputs.sarif-output }}" ]; then
            echo "::warning title=UDPA gate::Purity score ${SCORE:-below threshold}/100, required $MIN_PURITY — advisory mode, not failing the job."
          else
            exit "$GATE_STATUS"
          fi
        fi

        echo "sarif-file=${{ inputs.sarif-output }}" >> "$GITHUB_OUTPUT"
        echo "passport-file=${{ inputs.passport-output }}" >> "$GITHUB_OUTPUT"
